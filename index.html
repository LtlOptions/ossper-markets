<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ossper Markets</title>
<style>
body{margin:0;background:#07111f;color:#edf4ff;font-family:system-ui,-apple-system,sans-serif}
main{max-width:900px;margin:auto;padding:40px 22px}
.card{background:#0d1a2b;border:1px solid #1d3047;border-radius:18px;padding:24px;margin-top:20px}
h1{font-size:38px;margin:0 0 8px}.muted{color:#91a3ba}
.balance{font-size:32px;font-weight:800;margin:24px 0}
button{padding:13px 18px;border-radius:10px;border:1px solid #35506d;background:#142842;color:white;font-size:16px;margin-right:8px}
</style>
</head>
<body>
<main>
  <div class="muted">COMMUNITY PREDICTION MARKET</div>
  <h1>Ossper Markets</h1>
  <p class="muted">Live deployment test — virtual money only.</p>
  <div class="card">
    <div class="muted">Available balance</div>
    <div class="balance" id="balance">$500.00</div>
    <button id="add">Test +$10</button>
    <button id="buy">Test Buy YES ($6.40)</button>
  </div>
  <div class="card">
    <b>Deployment status</b>
    <p id="status" class="muted">Checking backend…</p>
  </div>
</main>
<script>
let balance=500;
const money=n=>"$"+n.toFixed(2);
document.getElementById("add").onclick=()=>{balance+=10;render()};
document.getElementById("buy").onclick=()=>{
  if(balance>=6.4){balance-=6.4;render()}
  else alert("Insufficient virtual balance");
};
function render(){document.getElementById("balance").textContent=money(balance)}
fetch("/api/health").then(r=>r.json()).then(d=>{
 document.getElementById("status").textContent="Backend connected ✓";
}).catch(()=>document.getElementById("status").textContent="Backend unavailable");
</script>
</body>
</html>
